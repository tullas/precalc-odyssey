<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precalc Odyssey: Math Realms</title>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/auth-guard.js"></script>
</head>
<body>
  <header>
    <h1>Precalc Odyssey: Journey Through Math Realms</h1>
    <nav>
      <a href="#units">Units</a>
      <a href="docs/mission.html">Mission Brief</a>
      <a href="#" id="logoutBtn" style="color:#ff6b6b;">Logout</a>
    </nav>
  </header>
  <main>
    <section id="intro">
      <h2>Welcome, Math Adventurer!</h2>
      <p>Embark on a narrative-driven quest to master Precalculus with visuals, games, and real-world hooks.</p>
      <p id="userInfo" style="color:#00ffcc; margin-top:1rem;"></p>
    </section>
    <section id="units">
      <h2>Course Realms</h2>
    </section>
  </main>
  <script src="js/main.js"></script>
  <script>
    // Show logged-in user
    const user = JSON.parse(localStorage.getItem("precalc_user") || "null");
    if (user) {
      document.getElementById("userInfo").textContent = `Logged in as: ${user.email} (${user.role})`;
    }

    // Logout
    document.getElementById("logoutBtn")?.addEventListener("click", (e) => {
      e.preventDefault();
      localStorage.removeItem("precalc_token");
      localStorage.removeItem("precalc_user");
      window.location.href = "/login.html";
    });
  </script>
</body>
</html>
