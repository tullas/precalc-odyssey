<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper-Scale — Integrated Prototype</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@500;600&display=swap');

    :root {
      --neon: #00f0ff;
      --pink: #ff00aa;
      --bg: #050510;
    }

    body {
      font-family: 'Rajdhani', sans-serif;
      background: radial-gradient(ellipse at 30% 20%, #0d0d2b 0%, #050510 70%);
      color: #e0e0ff;
      min-height: 100vh;
    }

    .font-orbitron { font-family: 'Orbitron', sans-serif; }

    .neon-text { text-shadow: 0 0 10px var(--neon), 0 0 20px var(--neon); }
    .neon-box {
      border: 1px solid rgba(0,240,255,0.45);
      box-shadow: 0 0 15px rgba(0,240,255,0.15), inset 0 0 12px rgba(0,240,255,0.05);
    }

    .card {
      transition: transform 0.18s ease, box-shadow 0.18s ease;
      cursor: pointer;
      user-select: none;
    }
    .card:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 0 22px rgba(0,240,255,0.55);
    }
    .card.active {
      outline: 2px solid var(--neon);
      box-shadow: 0 0 28px rgba(0,240,255,0.7);
    }

    canvas {
      background: #03030a;
      border-radius: 14px;
      box-shadow: 0 0 40px rgba(0,240,255,0.12);
    }

    .damage-popup {
      position: absolute;
      font-family: 'Orbitron', sans-serif;
      font-weight: 700;
      pointer-events: none;
      animation: floatUp 1.1s ease-out forwards;
      text-shadow: 0 0 12px currentColor;
      z-index: 20;
    }
    @keyframes floatUp {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.5); }
    }

    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.88);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; opacity: 0; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    .overlay.show { opacity: 1; pointer-events: all; }
  </style>
</head>
<body class="p-4 md:p-6 flex flex-col items-center">

  <!-- Header -->
  <header class="w-full max-w-6xl flex justify-between items-center mb-5">
    <h1 class="font-orbitron text-3xl md:text-4xl neon-text tracking-widest">HYPER-SCALE</h1>
    <div class="text-right">
      <div class="text-xs text-cyan-400/70 uppercase tracking-widest">Target</div>
      <div id="targetScore" class="font-orbitron text-2xl text-cyan-300">1200</div>
    </div>
  </header>

  <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-3 gap-5">

    <!-- Canvas -->
    <div class="lg:col-span-2 relative">
      <canvas id="graphCanvas" width="820" height="440" class="w-full"></canvas>

      <div class="absolute top-3 left-3 neon-box bg-black/60 px-4 py-2 rounded-lg">
        <div class="text-xs text-cyan-400/80 uppercase">Damage</div>
        <div id="liveScore" class="font-orbitron text-3xl text-white">0</div>
      </div>

      <div id="continuityBadge" class="absolute top-3 right-3 px-3 py-1 rounded text-xs font-bold uppercase tracking-wider hidden"></div>
    </div>

    <!-- Side Panel -->
    <div class="flex flex-col gap-4">
      <div class="neon-box rounded-xl p-4 bg-black/40">
        <h2 class="font-orbitron text-xs text-cyan-400 mb-2 tracking-widest">ACTIVE FUNCTION</h2>
        <div id="activeDisplay" class="min-h-[70px] flex items-center justify-center text-cyan-200/50 text-sm italic">
          Slot a Parent Function
        </div>
        <div id="transformList" class="mt-2 space-y-1 text-xs text-purple-300"></div>
      </div>

      <button id="executeBtn"
        class="w-full py-4 font-orbitron font-bold text-lg tracking-wider rounded-xl
               bg-gradient-to-r from-cyan-600 to-fuchsia-700 hover:from-cyan-500 hover:to-fuchsia-600
               transition shadow-lg hover:shadow-cyan-500/30">
        EXECUTE SCRIPT
      </button>

      <div class="flex justify-between text-xs text-cyan-400/60">
        <span>Draw: <span id="drawCount">0</span></span>
        <span>Discard: <span id="discardCount">0</span></span>
      </div>

      <div id="statusText" class="text-center text-sm text-cyan-300/70 h-5"></div>
    </div>
  </div>

  <!-- Hand -->
  <div class="w-full max-w-6xl mt-8">
    <h2 class="font-orbitron text-xs text-cyan-400 mb-3 tracking-widest">HAND</h2>
    <div id="handContainer" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3"></div>
  </div>

  <!-- Result Overlay -->
  <div id="resultOverlay" class="overlay">
    <div class="text-center p-10 rounded-2xl neon-box bg-black/95 max-w-md">
      <h2 id="resultTitle" class="font-orbitron text-5xl mb-3"></h2>
      <p id="resultScore" class="text-xl text-cyan-300 mb-6"></p>
      <button id="restartBtn" class="px-8 py-3 font-orbitron font-bold rounded-lg bg-cyan-700 hover:bg-cyan-600 transition">
        REBOOT
      </button>
    </div>
  </div>

<script>
/* =====================================================
   MathEngine
===================================================== */
class MathEngine {
  constructor() {
    this.MAX = 1e6; this.MIN = -1e6; this.EPS = 1e-9; this.THRESH = 0.1;
    this.parents = {
      linear:      x => x,
      quadratic:   x => x * x,
      exponential: x => Math.pow(2, x),
      logarithmic: x => x <= 0 ? NaN : Math.log2(x),
      rational:    x => Math.abs(x) < this.EPS ? Infinity : 1 / x
    };
  }
  clamp(v) {
    if (Number.isNaN(v) || !Number.isFinite(v)) return 0;
    return Math.max(this.MIN, Math.min(this.MAX, v));
  }
  evaluate(card, x) {
    const type = card.type || card.parentType;
    const a = card.a ?? 1;
    const h = card.h ?? 0;
    const fn = this.parents[type];
    if (!fn) return 0;
    let raw = fn(x - h);
    if (Number.isNaN(raw)) return 0;
    if (!Number.isFinite(raw)) return this.clamp(raw > 0 ? this.MAX : this.MIN);
    return this.clamp(a * raw);
  }
  generatePlotPoints(card, from=0, to=10, samples=45) {
    const pts = [];
    const step = 1 / samples;
    for (let t = from; t <= to + this.EPS; t += step) {
      pts.push({ x: t, y: this.evaluate(card, t) });
    }
    return pts;
  }
  validatePiecewiseContinuity(a, b, turn) {
    const left = this.evaluate(a, turn);
    const right = this.evaluate(b, turn);
    const delta = Math.abs(left - right);
    return delta <= this.THRESH
      ? { status: 'Continuous', delta, multiplier: 3 }
      : { status: 'Jump Discontinuity', delta, multiplier: 1 };
  }
  describe(card) {
    const map = { linear:'x', quadratic:'x²', exponential:'2ˣ', logarithmic:'log₂(x)', rational:'1/x' };
    let expr = map[card.type || card.parentType] || '?';
    const a = card.a ?? 1, h = card.h ?? 0;
    if (h !== 0) expr = expr.replace(/x/g, `(x${h>0?' − ':' + '}${Math.abs(h)})`);
    if (a !== 1) expr = `${a}·${expr}`;
    return expr;
  }
}

/* =====================================================
   Card / Deck / Library / CombatManager
===================================================== */
class Card {
  constructor(o) {
    Object.assign(this, {
      id: o.id, name: o.name, type: o.type,
      parentType: o.parentType || null,
      a: o.a ?? 1, h: o.h ?? 0,
      description: o.description || '',
      color: o.color || '#00f0ff',
      rarity: o.rarity || 'common'
    });
  }
  toMath() { return { type: this.parentType || this.type, a: this.a, h: this.h }; }
  clone() {
    return new Card({ ...this, id: this.id + '_' + Math.random().toString(36).slice(2,6) });
  }
}

class Deck {
  constructor(cards=[]) {
    this.drawPile = [...cards];
    this.discardPile = [];
    this.exhaustPile = [];
    this.hand = [];
    this.shuffle();
  }
  shuffle() {
    for (let i = this.drawPile.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.drawPile[i], this.drawPile[j]] = [this.drawPile[j], this.drawPile[i]];
    }
  }
  draw(n=1) {
    const out = [];
    for (let i=0; i<n; i++) {
      if (!this.drawPile.length) {
        if (!this.discardPile.length) break;
        this.drawPile = [...this.discardPile];
        this.discardPile = [];
        this.shuffle();
      }
      const c = this.drawPile.pop();
      if (c) { this.hand.push(c); out.push(c); }
    }
    return out;
  }
  discard(card) {
    const i = this.hand.findIndex(c => c.id === card.id);
    if (i !== -1) {
      this.hand.splice(i, 1);
      this.discardPile.push(card);
    }
  }
  discardHand() {
    while (this.hand.length) this.discard(this.hand[0]);
  }
}

const CardLibrary = {
  createStarterDeck() {
    const list = [];
    const add = (o) => list.push(new Card(o));

    add({ id:'lin', name:'Linear Core', type:'parent', parentType:'linear',
          description:'f(x)=x', color:'#00f0ff' });
    add({ id:'quad', name:'Quadratic Surge', type:'parent', parentType:'quadratic',
          description:'f(x)=x²', color:'#ff00aa', rarity:'uncommon' });
    add({ id:'exp', name:'Exponential Spike', type:'parent', parentType:'exponential',
          description:'f(x)=2ˣ', color:'#bf00ff', rarity:'rare' });
    add({ id:'log', name:'Log Dampen', type:'parent', parentType:'logarithmic',
          description:'f(x)=log₂(x)', color:'#00ff9f' });
    add({ id:'rat', name:'Rational Singularity', type:'parent', parentType:'rational',
          description:'f(x)=1/x', color:'#ffaa00', rarity:'uncommon' });

    add({ id:'s2', name:'×2 Stretch', type:'modifier', a:2, h:0, color:'#ff6b6b',
          description:'Vertical stretch ×2' });
    add({ id:'c05', name:'×0.5 Compress', type:'modifier', a:0.5, h:0, color:'#4ecdc4',
          description:'Vertical compress' });
    add({ id:'sh2', name:'Shift +2', type:'modifier', a:1, h:2, color:'#ffe66d',
          description:'Horizontal +2' });
    add({ id:'shm3', name:'Shift −3', type:'modifier', a:1, h:-3, color:'#a29bfe',
          description:'Horizontal −3' });
    add({ id:'combo', name:'Amplify & Offset', type:'modifier', a:3, h:1, color:'#fd79a8',
          description:'×3 + shift 1', rarity:'rare' });

    // extras
    list.push(list[0].clone(), list[1].clone(), list[5].clone(), list[6].clone());
    return list;
  }
};

class CombatManager {
  constructor(math) {
    this.math = math;
    this.deck = null;
    this.active = null;
    this.score = 0;
    this.target = 1200;
    this.running = false;
  }
  start(target=1200) {
    this.deck = new Deck(CardLibrary.createStarterDeck());
    this.active = null;
    this.score = 0;
    this.target = target;
    this.running = false;
    this.deck.draw(5);
    return this.deck.hand;
  }
  slotParent(card) {
    if (card.type !== 'parent') return false;
    this.active = { type: card.parentType, a:1, h:0 };
    this.deck.discard(card);
    return true;
  }
  applyModifier(card) {
    if (!this.active || card.type !== 'modifier') return false;
    this.active.a *= card.a;
    this.active.h += card.h;
    this.deck.discard(card);
    return true;
  }
  getHand() { return this.deck ? this.deck.hand : []; }
  piles() {
    return this.deck ? {
      draw: this.deck.drawPile.length,
      discard: this.deck.discardPile.length
    } : { draw:0, discard:0 };
  }
}

/* =====================================================
   Juice
===================================================== */
class Juice {
  constructor(canvas) {
    this.canvas = canvas;
    this.particles = [];
    this.shake = { mag:0, dur:0, ox:0, oy:0 };
    this.punch = { x:0, y:0 };
    this.flash = { a:0, color:'#fff' };
    this.hitStop = 0;
    this.timeScale = 1;
  }
  shakeScreen(mag=7, dur=300) {
    this.shake.mag = Math.max(this.shake.mag, mag);
    this.shake.dur = Math.max(this.shake.dur, dur);
  }
  cameraPunch(dx=0, dy=-1, force=14) {
    this.punch.x += dx * force;
    this.punch.y += dy * force;
  }
  doHitStop(ms=50) {
    this.hitStop = ms;
    this.timeScale = 0.04;
  }
  flashScreen(color='#00f0ff', str=0.35) {
    this.flash.color = color;
    this.flash.a = str;
  }
  spawn(x, y, opts={}) {
    const n = opts.count || 12;
    for (let i=0; i<n; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = (opts.speed || 4) * (0.5 + Math.random());
      this.particles.push({
        x, y,
        vx: Math.cos(ang)*spd,
        vy: Math.sin(ang)*spd,
        life: opts.life || 550,
        max: opts.life || 550,
        size: (opts.size || 3) * (0.6+Math.random()*0.7),
        color: opts.color || '#00f0ff',
        g: opts.gravity || 0.09,
        a: 1
      });
    }
  }
  heavy(x, y, color='#ff00aa') {
    this.shakeScreen(12, 340);
    this.cameraPunch(0, -1, 18);
    this.doHitStop(60);
    this.flashScreen(color, 0.42);
    this.spawn(x, y, { count:24, speed:7.5, life:800, color, size:3.8 });
  }
  combo(x, y) {
    this.shakeScreen(5, 220);
    this.flashScreen('#00f0ff', 0.3);
    this.spawn(x, y, { count:16, speed:5.5, color:'#00f0ff', size:3.3 });
  }
  tick(x, y) {
    this.spawn(x, y, { count:4, speed:2.6, life:360, color:'#fff', size:2 });
  }
  update(dt=16.6) {
    if (this.hitStop > 0) {
      this.hitStop -= dt;
      if (this.hitStop <= 0) this.timeScale = 1;
    }
    if (this.shake.dur > 0) {
      this.shake.dur -= dt;
      const p = Math.max(0, this.shake.dur / 300);
      this.shake.ox = (Math.random()-0.5)*2*this.shake.mag*p;
      this.shake.oy = (Math.random()-0.5)*2*this.shake.mag*p;
      if (this.shake.dur <= 0) { this.shake.ox = this.shake.oy = this.shake.mag = 0; }
    }
    this.punch.x *= 0.82;
    this.punch.y *= 0.82;
    if (this.flash.a > 0) this.flash.a *= 0.87;

    for (let i=this.particles.length-1; i>=0; i--) {
      const p = this.particles[i];
      p.life -= dt * this.timeScale;
      p.vy += p.g * this.timeScale;
      p.x += p.vx * this.timeScale;
      p.y += p.vy * this.timeScale;
      p.a = Math.max(0, p.life / p.max);
      if (p.life <= 0) this.particles.splice(i,1);
    }
  }
  begin(ctx) {
    ctx.save();
    ctx.translate(this.shake.ox + this.punch.x, this.shake.oy + this.punch.y);
  }
  end(ctx) { ctx.restore(); }
  draw(ctx) {
    for (const p of this.particles) {
      ctx.globalAlpha = p.a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*p.a, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = p.a * 0.3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size*2.6, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (this.flash.a > 0) {
      ctx.fillStyle = this.flash.color;
      ctx.globalAlpha = this.flash.a * 0.32;
      ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
      ctx.globalAlpha = 1;
    }
  }
  reset() {
    this.particles = [];
    this.shake = { mag:0, dur:0, ox:0, oy:0 };
    this.punch = { x:0, y:0 };
    this.flash.a = 0;
    this.hitStop = 0;
    this.timeScale = 1;
  }
}

/* =====================================================
   Integrated GameUI
===================================================== */
class GameUI {
  constructor() {
    this.canvas = document.getElementById('graphCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.w = this.canvas.width;
    this.h = this.canvas.height;

    this.math = new MathEngine();
    this.combat = new CombatManager(this.math);
    this.juice = new Juice(this.canvas);

    this.points = [];
    this.particleT = 0;
    this.particleActive = false;
    this.executing = false;

    this._bind();
    this.startNewRun();
    this._loop();
  }

  startNewRun() {
    this.combat.start(1200);
    this.points = [];
    this.particleActive = false;
    this.executing = false;
    document.getElementById('liveScore').textContent = '0';
    document.getElementById('continuityBadge').classList.add('hidden');
    document.getElementById('resultOverlay').classList.remove('show');
    this.juice.reset();
    this._renderHand();
    this._updateActive();
    this._updatePiles();
    this._status('');
  }

  _bind() {
    document.getElementById('executeBtn').onclick = () => this.execute();
    document.getElementById('restartBtn').onclick = () => this.startNewRun();
  }

  _renderHand() {
    const box = document.getElementById('handContainer');
    box.innerHTML = '';
    this.combat.getHand().forEach(card => {
      const el = document.createElement('div');
      el.className = 'card neon-box rounded-xl p-3 bg-black/50 text-center';
      el.innerHTML = `
        <div class="text-[10px] uppercase tracking-wider mb-1" style="color:${card.color}">${card.type}</div>
        <div class="font-orbitron text-sm leading-tight">${card.name}</div>
      `;
      el.onclick = () => this.onCard(card);
      box.appendChild(el);
    });
  }

  onCard(card) {
    if (this.executing) return;

    if (card.type === 'parent') {
      this.combat.slotParent(card);
      this.juice.shakeScreen(4, 160);
      this._status(`Slotted: ${card.name}`);
    } else {
      if (!this.combat.active) {
        this._status('Slot a Parent Function first');
        return;
      }
      this.combat.applyModifier(card);
      this.juice.shakeScreen(3, 140);
      this.juice.spawn(this.w/2, this.h/2, { count:8, color:card.color, speed:3.5 });
      this._status(`Applied: ${card.name}`);
    }

    this._recalc();
    this._updateActive();
    this._renderHand();
    this._updatePiles();
  }

  _recalc() {
    if (!this.combat.active) { this.points = []; return; }
    this.points = this.math.generatePlotPoints(this.combat.active, 0, 10, 50);
  }

  _updateActive() {
    const el = document.getElementById('activeDisplay');
    const list = document.getElementById('transformList');
    if (!this.combat.active) {
      el.innerHTML = '<span class="italic text-cyan-200/40">Slot a Parent Function</span>';
      list.innerHTML = '';
      return;
    }
    el.innerHTML = `<div class="font-orbitron text-xl text-cyan-300">${this.math.describe(this.combat.active)}</div>`;
    list.innerHTML = '';
  }

  _updatePiles() {
    const p = this.combat.piles();
    document.getElementById('drawCount').textContent = p.draw;
    document.getElementById('discardCount').textContent = p.discard;
  }

  _status(msg) {
    document.getElementById('statusText').textContent = msg;
  }

  async execute() {
    if (!this.combat.active || this.executing) return;
    this.executing = true;
    this.particleActive = true;
    this.particleT = 0;
    this.combat.score = 0;
    document.getElementById('liveScore').textContent = '0';

    const cont = this.math.validatePiecewiseContinuity(
      this.combat.active, this.combat.active, 5
    );
    const mult = cont.multiplier;

    if (cont.status === 'Continuous') {
      const badge = document.getElementById('continuityBadge');
      badge.textContent = 'Continuous ×3';
      badge.className = 'absolute top-3 right-3 px-3 py-1 rounded text-xs font-bold uppercase tracking-wider bg-cyan-900/80 text-cyan-300 border border-cyan-400';
      badge.classList.remove('hidden');
      this.juice.combo(this.w * 0.7, this.h * 0.35);
    }

    this._status('Executing mathematical script…');

    const steps = 110;
    for (let i = 0; i <= steps; i++) {
      const t = (i / steps) * 10;
      this.particleT = t;
      const dmg = this.math.evaluate(this.combat.active, t);
      this.combat.score = Math.round(dmg * (t / 10) * 13 * mult);

      document.getElementById('liveScore').textContent = this.combat.score;

      // Map particle to canvas for juice
      const maxY = Math.max(20, ...this.points.map(p => Math.abs(p.y))) * 1.3 || 40;
      const pad = 50;
      const cx = pad + (t / 10) * (this.w - pad * 2);
      const cy = pad + (this.h - pad * 2) / 2 - (dmg / maxY) * ((this.h - pad * 2) / 2);

      if (i % 14 === 0) {
        this.juice.tick(cx, cy);
        if (Math.abs(dmg) > 60) this.juice.shakeScreen(2, 80);
      }
      if (Math.abs(dmg) > 120 && i % 20 === 0) {
        this.juice.heavy(cx, cy);
      }

      await new Promise(r => setTimeout(r, 26));
    }

    this.particleActive = false;
    this.executing = false;

    const victory = this.combat.score >= this.combat.target;
    if (victory) this.juice.heavy(this.w/2, this.h/2, '#00f0ff');
    else this.juice.shakeScreen(9, 400);

    this._showResult(victory, this.combat.score);
  }

  _showResult(victory, score) {
    const ov = document.getElementById('resultOverlay');
    document.getElementById('resultTitle').textContent = victory ? 'VICTORY' : 'SYSTEM DEFEATED';
    document.getElementById('resultTitle').style.color = victory ? '#00f0ff' : '#ff0066';
    document.getElementById('resultScore').textContent = `Final Damage: ${score}`;
    ov.classList.add('show');
  }

  _loop() {
    const frame = () => {
      this.juice.update(16.6);
      this._draw();
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  _draw() {
    const ctx = this.ctx;
    const w = this.w, h = this.h;

    ctx.fillStyle = '#03030a';
    ctx.fillRect(0, 0, w, h);

    this.juice.begin(ctx);

    // Dynamic scale
    let maxY = 25;
    if (this.points.length) maxY = Math.max(25, ...this.points.map(p => Math.abs(p.y))) * 1.3;

    const pad = 50;
    const gw = w - pad * 2;
    const gh = h - pad * 2;
    const tx = t => pad + (t / 10) * gw;
    const ty = y => pad + gh / 2 - (y / maxY) * (gh / 2);

    // Grid
    ctx.strokeStyle = 'rgba(0,240,255,0.05)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 10; i++) {
      ctx.beginPath();
      ctx.moveTo(tx(i), pad);
      ctx.lineTo(tx(i), h - pad);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(0,240,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(pad, ty(0));
    ctx.lineTo(w - pad, ty(0));
    ctx.stroke();

    // Labels
    ctx.fillStyle = 'rgba(0,240,255,0.45)';
    ctx.font = '11px Orbitron';
    ctx.textAlign = 'center';
    for (let i = 0; i <= 10; i += 2) ctx.fillText(i, tx(i), h - pad + 18);

    // Neon curve
    if (this.points.length > 1) {
      ctx.lineWidth = 7;
      ctx.strokeStyle = 'rgba(0,240,255,0.12)';
      ctx.beginPath();
      this.points.forEach((p, i) => i ? ctx.lineTo(tx(p.x), ty(p.y)) : ctx.moveTo(tx(p.x), ty(p.y)));
      ctx.stroke();

      ctx.lineWidth = 3;
      ctx.strokeStyle = '#00f0ff';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      this.points.forEach((p, i) => i ? ctx.lineTo(tx(p.x), ty(p.y)) : ctx.moveTo(tx(p.x), ty(p.y)));
      ctx.stroke();
      ctx.shadowBlur = 0;
    }

    // Particle
    if (this.particleActive && this.combat.active) {
      const y = this.math.evaluate(this.combat.active, this.particleT);
      const cx = tx(this.particleT);
      const cy = ty(y);

      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 16);
      g.addColorStop(0, 'rgba(255,0,200,0.85)');
      g.addColorStop(1, 'rgba(255,0,200,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, 3.5, 0, Math.PI * 2);
      ctx.fill();
    }

    this.juice.end(ctx);
    this.juice.draw(ctx);
  }
}

// Boot
window.addEventListener('DOMContentLoaded', () => {
  window.game = new GameUI();
  console.log('%c HYPER-SCALE ONLINE ', 'background:#00f0ff;color:#000;font-weight:bold;padding:4px 10px');
});
</script>
