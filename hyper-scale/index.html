<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper-Scale Lab</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="graph.js"></script>
  <script src="visuals.js"></script>
  <script src="scenarios.js"></script>
  <script src="lab.js"></script>
  <script>
    (function () {
      const token = localStorage.getItem('precalc_token');
      const user = localStorage.getItem('precalc_user');
      if (!token || !user) window.location.href = '/login.html';
    })();
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #0b0f14; color: #e8eef5; min-height: 100vh; }
    .mono { font-family: 'JetBrains Mono', monospace; }
    .panel { background: #121821; border: 1px solid #1e2a38; border-radius: 12px; }
    input[type=range] { width: 100%; accent-color: #3db8ff; }
    canvas { width: 100%; border-radius: 10px; background: #080c10; }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: #1a2836; color: #8ec8ef; }
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center;
      z-index: 50; padding: 1rem;
    }
    .modal-backdrop.hidden { display: none; }
    a.home-link { color: #fff; text-decoration: underline; text-underline-offset: 4px; }
    a.home-link:hover { color: #7dd3fc; }
  </style>
</head>
<body class="p-4 md:p-6 max-w-6xl mx-auto">

  <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-xl md:text-2xl font-semibold tracking-tight">
        <a href="/hyper-scale/" class="home-link" id="titleHome">Hyper-Scale Lab</a>
      </h1>
      <p class="text-sm text-slate-400">
        <a href="/hyper-scale/" class="text-sky-400 hover:text-sky-300 underline underline-offset-2" id="homeLink">← Home</a>
        · Self-study lab
      </p>
    </div>
    <div class="flex items-center gap-2">
      <a href="/hyper-scale/" class="text-sm px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300 hover:border-sky-500 hover:text-sky-300" id="homeBtn">Home</a>
      <button id="pickBtn" class="text-sm px-3 py-1.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-white">New scenario</button>
      <button id="logoutBtn" class="text-sm px-3 py-1.5 rounded-lg border border-slate-600 text-slate-300">Logout</button>
    </div>
  </header>

  <div id="picker" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3 mb-6">
    <button data-f="all" class="panel p-4 text-left hover:border-sky-500/50 transition">
      <div class="text-xs text-sky-400 mb-1">Random</div>
      <div class="font-medium">Any scenario</div>
    </button>
    <button data-f="exponential" class="panel p-4 text-left hover:border-sky-500/50 transition">
      <div class="text-xs text-pink-400 mb-1">Exponential</div>
      <div class="font-medium">Growth & decay</div>
    </button>
    <button data-f="quadratic" class="panel p-4 text-left hover:border-sky-500/50 transition">
      <div class="text-xs text-fuchsia-400 mb-1">Quadratic</div>
      <div class="font-medium">Curves & projectiles</div>
    </button>
    <button data-f="linear" class="panel p-4 text-left hover:border-sky-500/50 transition">
      <div class="text-xs text-sky-400 mb-1">Linear</div>
      <div class="font-medium">Steady change</div>
    </button>
    <button data-f="logarithmic" class="panel p-4 text-left hover:border-sky-500/50 transition">
      <div class="text-xs text-emerald-400 mb-1">Logarithmic</div>
      <div class="font-medium">Scales</div>
    </button>
    <button data-f="rational" class="panel p-4 text-left hover:border-sky-500/50 transition">
      <div class="text-xs text-amber-400 mb-1">Rational</div>
      <div class="font-medium">Rates & sharing</div>
    </button>
  </div>

  <div id="lab" class="hidden space-y-4">
    <div class="panel p-4 md:p-5">
      <div class="flex flex-wrap items-center gap-2 mb-2">
        <h2 id="title" class="text-lg font-semibold text-white"></h2>
        <span id="familyChip" class="chip"></span>
      </div>
      <p id="context" class="text-sm text-slate-300 leading-relaxed mb-3"></p>
      <p id="question" class="text-sm text-sky-100/90 leading-relaxed border-l-2 border-sky-500 pl-3"></p>
    </div>

    <div class="grid lg:grid-cols-5 gap-4">
      <div class="lg:col-span-3 panel p-3">
        <canvas id="graph" width="720" height="400"></canvas>
        <p class="text-xs text-slate-500 text-center mt-1">Solution marker appears after a correct answer or 3 attempts.</p>
      </div>

      <div class="lg:col-span-2 space-y-3">
        <div class="panel p-4">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-1">Model</div>
          <div id="form" class="mono text-sky-300 text-sm mb-2"></div>
          <div id="glossary" class="text-xs text-slate-400 space-y-1 mb-4 leading-snug"></div>
          <div id="controls" class="space-y-4"></div>
        </div>

        <div class="panel p-4" id="answerPanel">
          <div class="flex justify-between items-center mb-2">
            <div class="text-xs uppercase tracking-wide text-slate-500">Check your reading</div>
            <div id="attemptsLabel" class="text-xs text-amber-400/90">3 attempts allowed</div>
          </div>
          <label id="answerPrompt" class="text-sm text-slate-300 block mb-2"></label>
          <div class="flex gap-2">
            <input id="answerInput" type="number" step="any" class="flex-1 bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm mono" placeholder="Your value" />
            <button id="checkBtn" class="px-4 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-sm font-medium">Check</button>
          </div>
          <p id="feedback" class="text-sm mt-2 min-h-[1.25rem]"></p>
        </div>

        <div class="panel p-4 hidden" id="hintsPanel">
          <div class="text-xs uppercase tracking-wide text-slate-500 mb-2">Hints</div>
          <ul id="hints" class="text-sm text-slate-400 space-y-1 list-disc list-inside"></ul>
        </div>

        <button id="backBtn" class="text-sm text-slate-400 hover:text-sky-300">← All scenarios</button>
      </div>
    </div>
  </div>

  <div id="solutionModal" class="modal-backdrop hidden">
    <div class="panel max-w-md w-full p-6 shadow-2xl border-sky-800/50">
      <h3 id="modalTitle" class="text-lg font-semibold text-white mb-3">Solution</h3>
      <div id="modalBody" class="text-sm text-slate-300 space-y-3 leading-relaxed"></div>
      <button id="modalClose" class="mt-5 w-full py-2.5 rounded-lg bg-sky-600 hover:bg-sky-500 text-sm font-medium">Next problem (same type)</button>
    </div>
  </div>

<script>
(function () {
  const MAX_ATTEMPTS = 3;
  const canvas = document.getElementById('graph');
  const ctx = canvas.getContext('2d');

  let scenario = null;
  let params = {};
  let attempts = 0;
  let solved = false;
  let revealSolution = false;
  let animT = null;
  let animId = null;

  function goHome(e) {
    if (e) e.preventDefault();
    showPicker();
    history.replaceState(null, '', '/hyper-scale/');
  }

  document.getElementById('titleHome').onclick = goHome;
  document.getElementById('homeLink').onclick = goHome;
  document.getElementById('homeBtn').onclick = goHome;

  document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('precalc_token');
    localStorage.removeItem('precalc_user');
    location.href = '/login.html';
  };

  document.getElementById('pickBtn').onclick = () => openScenario(window.pickScenario(null));
  document.getElementById('backBtn').onclick = showPicker;

  document.getElementById('modalClose').onclick = () => {
    document.getElementById('solutionModal').classList.add('hidden');
    if (scenario && window.rerollScenario) {
      openScenario(window.rerollScenario(scenario.id));
    } else {
      openScenario(window.pickScenario(scenario ? scenario.family : null));
    }
  };

  document.querySelectorAll('#picker [data-f]').forEach(btn => {
    btn.onclick = () => {
      const f = btn.dataset.f === 'all' ? null : btn.dataset.f;
      openScenario(window.pickScenario(f));
    };
  });

  function showPicker() {
    document.getElementById('picker').classList.remove('hidden');
    document.getElementById('lab').classList.add('hidden');
    document.getElementById('solutionModal').classList.add('hidden');
    stopAnim();
  }

  function updateAttemptsUI() {
    const left = MAX_ATTEMPTS - attempts;
    const el = document.getElementById('attemptsLabel');
    if (solved) {
      el.textContent = 'Solved';
      el.className = 'text-xs text-emerald-400';
    } else if (attempts >= MAX_ATTEMPTS) {
      el.textContent = 'No attempts left';
      el.className = 'text-xs text-rose-400';
    } else {
      el.textContent = left + ' attempt' + (left === 1 ? '' : 's') + ' left (max ' + MAX_ATTEMPTS + ')';
      el.className = 'text-xs text-amber-400/90';
    }
  }

  function renderGlossary() {
    const g = scenario.symbolGlossary || [];
    const el = document.getElementById('glossary');
    if (!g.length) { el.innerHTML = ''; return; }
    el.innerHTML = g.map(item =>
      `<div><span class="mono text-sky-400">${item.sym}</span> — ${item.mean}</div>`
    ).join('');
  }

  function openScenario(s) {
    scenario = s;
    if (!scenario) return;

    params = {};
    scenario.params.forEach(p => { params[p.key] = p.default; });
    attempts = 0;
    solved = false;
    revealSolution = false;

    document.getElementById('picker').classList.add('hidden');
    document.getElementById('lab').classList.remove('hidden');
    document.getElementById('solutionModal').classList.add('hidden');
    document.getElementById('title').textContent = scenario.title;
    document.getElementById('familyChip').textContent = scenario.family;
    document.getElementById('context').textContent = scenario.context;
    document.getElementById('question').textContent = scenario.question;
    document.getElementById('form').textContent = scenario.form;
    renderGlossary();
    document.getElementById('feedback').textContent = '';
    document.getElementById('answerInput').value = '';
    document.getElementById('answerInput').disabled = false;
    document.getElementById('checkBtn').disabled = false;

    document.getElementById('hintsPanel').classList.add('hidden');
    document.getElementById('hints').innerHTML = (scenario.hints || []).map(h => `<li>${h}</li>`).join('');

    if (scenario.answer && scenario.answer.type === 'numeric') {
      document.getElementById('answerPanel').classList.remove('hidden');
      document.getElementById('answerPrompt').textContent = scenario.answer.prompt || 'Your answer';
    } else {
      document.getElementById('answerPanel').classList.add('hidden');
    }

    updateAttemptsUI();
    buildControls();
    draw();
    if (scenario.motion) startAnim();
    else stopAnim();
  }

  function buildControls() {
    const box = document.getElementById('controls');
    box.innerHTML = '';
    scenario.params.forEach(p => {
      const wrap = document.createElement('div');
      wrap.innerHTML = `
        <div class="flex justify-between text-xs text-slate-400 mb-1">
          <span>${p.label}</span>
          <span class="mono text-sky-300" id="val_${p.key}">${params[p.key]}</span>
        </div>
        <input type="range" min="${p.min}" max="${p.max}" step="${p.step}" value="${params[p.key]}" data-key="${p.key}" />
      `;
      box.appendChild(wrap);
      wrap.querySelector('input').oninput = (e) => {
        params[p.key] = parseFloat(e.target.value);
        document.getElementById('val_' + p.key).textContent = params[p.key];
        draw();
      };
    });
  }

  function idealParams() {
    return scenario.idealParams || Object.fromEntries(scenario.params.map(p => [p.key, p.default]));
  }

  function buildSolutionExplanation() {
    const a = scenario.answer;
    const atX = a.atX;
    const target = a.target;
    const ideal = idealParams();
    const modelY = window.LabMath.valueAt(scenario, ideal, atX);

    let steps = `<p><strong class="text-white">Target:</strong> about <span class="mono text-sky-300">${target}</span> at <span class="mono">x = ${atX}</span>.</p>`;
    steps += `<p><strong class="text-white">Model:</strong> <span class="mono text-sky-300">${scenario.form}</span></p>`;
    if (scenario.symbolGlossary && scenario.symbolGlossary.length) {
      steps += `<ul class="list-none text-slate-400 text-xs space-y-1">`;
      scenario.symbolGlossary.forEach(g => {
        steps += `<li><span class="mono text-sky-400">${g.sym}</span> — ${g.mean}</li>`;
      });
      steps += `</ul>`;
    }
    steps += `<p><strong class="text-white">Parameters that work:</strong></p><ul class="list-disc list-inside text-slate-400">`;
    scenario.params.forEach(p => {
      steps += `<li>${p.label}: <span class="mono text-sky-300">${ideal[p.key]}</span></li>`;
    });
    steps += `</ul>`;
    if (modelY != null) {
      steps += `<p>At x = ${atX}: <span class="mono text-emerald-400">y ≈ ${modelY.toFixed(2)}</span>.</p>`;
    }
    return steps;
  }

  function showSolutionModal(title) {
    document.getElementById('modalTitle').textContent = title;
    document.getElementById('modalBody').innerHTML = buildSolutionExplanation();
    document.getElementById('solutionModal').classList.remove('hidden');
  }

  document.getElementById('checkBtn').onclick = () => {
    if (!scenario || !scenario.answer || solved || attempts >= MAX_ATTEMPTS) return;

    const raw = document.getElementById('answerInput').value;
    const userVal = parseFloat(raw);
    const fb = document.getElementById('feedback');

    if (Number.isNaN(userVal)) {
      fb.className = 'text-sm mt-2 text-amber-400';
      fb.textContent = 'Enter a number.';
      return;
    }

    attempts += 1;
    updateAttemptsUI();

    const target = scenario.answer.target;
    const tol = scenario.answer.tol ?? 1;
    const ok = Math.abs(userVal - target) <= tol;

    if (ok) {
      solved = true;
      revealSolution = true;
      fb.className = 'text-sm mt-2 text-emerald-400';
      fb.textContent = 'Correct.';
      document.getElementById('answerInput').disabled = true;
      document.getElementById('checkBtn').disabled = true;
      updateAttemptsUI();
      draw();
      showSolutionModal('Well done — solution');
      return;
    }

    if (attempts === 2) {
      document.getElementById('hintsPanel').classList.remove('hidden');
    }

    if (attempts >= MAX_ATTEMPTS) {
      revealSolution = true;
      fb.className = 'text-sm mt-2 text-rose-400';
      fb.textContent = 'Out of attempts. See the worked solution.';
      document.getElementById('answerInput').disabled = true;
      document.getElementById('checkBtn').disabled = true;
      document.getElementById('hintsPanel').classList.remove('hidden');
      draw();
      showSolutionModal('Solution after 3 attempts');
    } else {
      const left = MAX_ATTEMPTS - attempts;
      fb.className = 'text-sm mt-2 text-rose-400';
      fb.textContent = `Not quite. ${left} attempt${left === 1 ? '' : 's'} left.` +
        (attempts >= 2 ? ' Hints are now available below.' : '');
    }
  };

  function draw() {
    if (!scenario) return;
    const w = canvas.width, h = canvas.height;
    ctx.fillStyle = '#080c10';
    ctx.fillRect(0, 0, w, h);

    const pts = window.LabMath.points(scenario, params, 100);
    const plot = window.HyperGraph.drawAxes(ctx, {
      w, h,
      points: pts.filter(p => Number.isFinite(p.y)),
      xMin: scenario.xMin, xMax: scenario.xMax,
      xStep: scenario.xMax > 12 ? 2 : 1,
      xLabel: scenario.xLabel,
      yLabel: scenario.yLabel,
      legend: scenario.form
    });

    window.HyperGraph.drawCurve(ctx, pts, plot.tx, plot.ty, '#3db8ff');

    if (revealSolution && scenario.answer && scenario.answer.atX != null) {
      const ax = scenario.answer.atX;
      const ideal = idealParams();
      const y = window.LabMath.valueAt(scenario, ideal, ax);
      const px = plot.tx(ax);
      ctx.strokeStyle = 'rgba(52, 211, 153, 0.55)';
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(px, plot.padT);
      ctx.lineTo(px, plot.padT + plot.plotH);
      ctx.stroke();
      ctx.setLineDash([]);
      if (y != null) {
        const py = plot.ty(y);
        ctx.fillStyle = '#34d399';
        ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#a7f3d0';
        ctx.font = '11px JetBrains Mono';
        ctx.textAlign = 'left';
        ctx.fillText(`x=${ax}  y=${y.toFixed(2)}`, px + 10, py - 8);
      }
    }

    if (animT != null && scenario.motion && window.HyperVisuals) {
      const V = window.HyperVisuals;
      const t = animT;
      if (scenario.motion === 'colonies') V.drawColonies(ctx, t, plot.tx, h);
      else if (scenario.motion === 'scale') V.drawScale(ctx, t, plot.tx, h, w, plot.padL);
      else if (scenario.motion === 'slices') V.drawSlices(ctx, t, plot.tx, h);
      else if (scenario.motion === 'ball') {
        const y = window.LabMath.valueAt(scenario, params, t);
        if (y != null) V.drawBall(ctx, true, plot.tx(t), plot.ty(y), w, h, plot.padL);
      }
    }
  }

  function startAnim() {
    stopAnim();
    const x0 = scenario.xMin, x1 = scenario.xMax;
    let u = 0;
    const step = () => {
      u += 0.004;
      if (u > 1) u = 0;
      animT = x0 + u * (x1 - x0);
      draw();
      animId = requestAnimationFrame(step);
    };
    animId = requestAnimationFrame(step);
  }

  function stopAnim() {
    if (animId) cancelAnimationFrame(animId);
    animId = null;
    animT = null;
  }
})();
</script>
</body>
</html>
